[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvision-phishing-email-analyzer"
version = "2.4.1"
description = "NexVision Offline Phishing Analyzer for evidence-led email and static link triage"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
dependencies = [
  "publicsuffix2>=2.20191221",
  "reportlab>=4.0,<5",
]

[project.urls]
Homepage = "https://github.com/NexvisionLab/Phishing-Email-Detection-and-Malicious-Artifact-Analyzer"
Documentation = "https://github.com/NexvisionLab/Phishing-Email-Detection-and-Malicious-Artifact-Analyzer/tree/main/docs"
Issues = "https://github.com/NexvisionLab/Phishing-Email-Detection-and-Malicious-Artifact-Analyzer/issues"
Security = "https://github.com/NexvisionLab/Phishing-Email-Detection-and-Malicious-Artifact-Analyzer/security/advisories/new"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
qr = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<6"]
qr-fallback = ["pyzbar>=0.1.9"]
dev = [
  "bandit>=1.9,<2",
  "build>=1.3,<2",
  "httpx2>=2.13,<3",
  "mypy>=1.18,<3",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "qrcode>=7.4,<9",
  "ruff>=0.13,<1",
]

[project.scripts]
phishcheck = "phishing_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["phishing_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["publicsuffix2", "reportlab.*"]
ignore_missing_imports = true

# Optional QR decoders. Their stubs may not be installed, and numpy's newer stubs need a newer Python than this project targets.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "cv2", "cv2.*", "pyzbar", "pyzbar.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true
